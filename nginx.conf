server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # TLS sonlandıran proxy arkasında otomatik yönlendirmeler iç portu sızdırmasın.
    absolute_redirect off;

    # Public Türkçe giriş adresi HTTPS kullanır; sorgu parametrelerini korur.
    location = /tr {
        return 301 https://socialsense.furkanerdogan.com/tr/$is_args$args;
    }

    # Eski image veya doğrudan web-root mount kullanımında da yapılandırmayı sunma.
    location ~* ^/nginx\.conf$ {
        return 404;
    }

    # Gzip sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Güvenlik başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Statik dosyalar için cache
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # add_header kullanan location üst seviyedeki başlıkları miras almaz.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # HTML dosyaları için cache (kısa süreli)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Ana sayfa yönlendirmesi
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Türkçe sayfalar
    location /tr/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # 404 hata sayfası
    error_page 404 /index.html;
}
